 function updatePreview(){const d=data(q("dialog-form")),totals={calories:0,protein_g:0,fat_g:0,carbs_g:0};(m.items||[]).forEach((_,index)=>Object.keys(totals).forEach(k=>totals[k]+=Number(d[`item_${index}_${k}`]||0)));clear(preview);preview.append(title,el("p",`${num(totals.calories)} ккал · Б ${num(totals.protein_g)} · Ж ${num(totals.fat_g)} · У ${num(totals.carbs_g)}`))}

function dialogSignal(){if(state.dialogAbort)state.dialogAbort.abort();state.dialogAbort=new AbortController();return state.dialogAbort.signal}
function customDialog(){openDialog("Выбрать диапазон",[{label:"С",name:"from",type:"date",value:state.custom?.from||state.date},{label:"По",name:"to",type:"date",value:state.custom?.to||state.date}],e=>{e.preventDefault();state.custom=data(e.currentTarget);closeDialog();dynamics()})}async function saveNorm(e){e.preventDefault();const f=e.currentTarget,d=data(f),p={effective_from:d.effective_from};["calories","protein_g","fat_g","carbs_g","water_ml"].forEach(k=>{if(d[k]!=="")p[k]=Number(d[k])});try{await formMutation(f,key=>api(path("norms",{client:state.clientId}),{method:"POST",idempotency:key,json:p}));plan();status("Норма сохранена")}catch(x){status(x.message,true)}}
async function xlsxPreview(file,box){if(!file)return;const p=box.querySelector("[data-preview]");clear(p);if(file.size>2097152){p.append(el("p","Файл больше 2 МБ.","status error"));return}p.append(el("p","Проверяем файл...","help"));try{box.dataset.key=box.dataset.key||idempotency();const d=await api(path("xlsxPreview",{client:state.clientId}),{method:"POST",idempotency:box.dataset.key,body:file,headers:{"Content-Type":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}});delete box.dataset.key;clear(p);p.append(el("h3","Предпросмотр"),planTable(d.rows||[]));if(d.conflicts?.length)p.append(el("p",`Совпадающих дат: ${d.conflicts.length}`,"help"));const b=el("button","Применить весь план");b.type="button";b.onclick=()=>xlsxCommit(d.upload_token,p,b);p.append(b)}catch(x){clear(p);p.append(el("p",x.message,"status error"))}}async function xlsxCommit(token,p,button){if(button.dataset.busy)return;button.dataset.busy="1";button.disabled=true;button.dataset.key=button.dataset.key||idempotency();try{await api(path("xlsxCommit",{client:state.clientId}),{method:"POST",idempotency:button.dataset.key,json:{upload_token:token}});delete button.dataset.key;plan();status("План применён полностью")}catch(x){p.append(el("p",x.message,"status error"))}finally{delete button.dataset.busy;button.disabled=false}}
function profileSummary(d){return `Имя: ${d.display_name||"не указано"}. Рост: ${d.height_cm??"не указан"} см. Начальный вес: ${d.initial_weight_kg??"не указан"} кг. Цель: ${d.goal||"не указана"}. Часовой пояс: ${d.timezone||"не указан"}`}async function saveProfile(e){e.preventDefault();const f=e.currentTarget,d=data(f),wasToday=state.date===state.session.today,p={display_name:d.display_name,timezone:d.timezone,goal:d.goal,height_cm:d.height_cm===""?null:Number(d.height_cm),initial_weight_kg:d.initial_weight_kg===""?null:Number(d.initial_weight_kg)};try{const saved=await formMutation(f,key=>api(path("profile"),{method:"PATCH",headers:{"If-Match":f.dataset.version},json:p,idempotency:key}));f.dataset.version=saved.version??f.dataset.version;state.session.user={...(state.session.user||{}),...saved};try{const latest=await api(path("session"));state.session=latest;if(wasToday)state.date=latest.today||state.date}catch(refreshError){}status("Профиль сохранён")}catch(x){if(x.status===409){try{const fresh=await api(path("profile"));showVersionConflict(f,"Профиль уже изменён",profileSummary(fresh),"Применить мои данные поверх новых",()=>{f.dataset.version=fresh.version;f.requestSubmit()},"Принять профиль сервера",profile);status("Выберите, какие данные профиля сохранить.",true)}catch(loadError){status(`Ваши поля сохранены, но актуальный профиль загрузить не удалось: ${loadError.message}`,true)}}else status(x.message,true)}}
function saveBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}
async function downloadTemplate(){try{saveBlob(await api(path("template"),{blob:true}),"norms-plan-template.xlsx")}catch(x){status(x.message,true)}}
async function openClientChat(){try{const d=await api(path("chat",{client:state.clientId}));if(!d.url)throw new Error("Ссылка на чат недоступна.");if(tg?.openTelegramLink)tg.openTelegramLink(d.url);else open(d.url,"_blank","noopener")}catch(x){status(x.message,true)}}
async function download(format,r){const p=new URLSearchParams({scope:state.mode==="self"?"self":"client",from:r.from,to:r.to,format});if(state.mode==="trainer")p.set("client_id",state.clientId);const url=`${path("export")}?${p}`;if(format==="print"){open(url,"_blank","noopener");return}try{saveBlob(await api(url,{blob:true}),`nutrition-${r.from}-${r.to}.${format}`)}catch(x){status(x.message,true)}}
qa("[data-view]").forEach(x=>x.onclick=()=>view(x.dataset.view));q("self-mode").onclick=()=>mode("self");q("trainer-mode").onclick=()=>mode("trainer");q("client-search").oninput=clientList;q("back-clients").onclick=()=>{q("clients-panel").dataset.selected="false";q("trainer-detail").dataset.selected="false";q("back-clients").hidden=true};q("refresh").onclick=()=>state.mode==="trainer"?loadClients().then(render):render();q("dialog-cancel").onclick=closeDialog;q("dialog").addEventListener("cancel",e=>{e.preventDefault();closeDialog()});session().catch(e=>status(e.message,true,session));
